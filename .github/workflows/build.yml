name: Build Mod (Windows)

on:
  workflow_dispatch:
  push:
    branches:
      - '**'

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Build the mod
        uses: geode-sdk/build-geode-mod@main
        id: build
        with:
          # IMPORTANT: GD 2.2081 needs the Geode 5.x SDK.
          # 'latest' is fine today (5.11.2). If Geode 6 ever becomes the latest stable
          # release, pin this to the 5.x version instead (see the instructions).
          sdk: v5.11.2

      - name: Upload the .geode file
        uses: actions/upload-artifact@v4
        with:
          name: structure-tools
          path: ${{ steps.build.outputs.build-output }}
